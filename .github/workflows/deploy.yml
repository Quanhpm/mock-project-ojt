name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Các secret này bạn cài trong Settings > Secrets của GitHub như đã nói ở bước trước
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Thay 'ten_repo_docker' bằng tên repo bạn tạo trên Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest
          # Giúp build nhanh hơn bằng cách cache các layer
          cache-from: type=gha
          cache-to: type=inline